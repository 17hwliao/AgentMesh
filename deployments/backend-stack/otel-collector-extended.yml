receivers:
  otlp:
    protocols:
      http: {endpoint: '0.0.0.0:4318'}
processors:
  memory_limiter: {check_interval: 1s,limit_mib: 96,spike_limit_mib: 16}
  batch: {timeout: 2s,send_batch_size: 128}
exporters:
  otlphttp:
    endpoint: http://jaeger:4318
    sending_queue: {enabled: true,queue_size: 1024}
    retry_on_failure: {enabled: true,initial_interval: 1s,max_interval: 5s,max_elapsed_time: 30s}
service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: {host: '0.0.0.0',port: 8888}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter,batch]
      exporters: [otlphttp]
