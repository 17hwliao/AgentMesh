services:
  control:
    networks: [private, egress]
    ports: ["127.0.0.1:29306:3306"]
  baseline:
    networks: [private, egress]
    ports: ["127.0.0.1:29307:3306"]
  candidate:
    networks: [private, egress]
    ports: ["127.0.0.1:29308:3306"]
  redis:
    networks: [private, egress]
    ports: ["127.0.0.1:29379:6379"]
  kafka:
    networks: [private, egress]
    ports: ["127.0.0.1:29092:9094"]
    environment:
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
  gateway:
    ports: !override ["127.0.0.1:29080:18080"]
  sentinel-api:
    ports: !override ["127.0.0.1:29081:8080"]
    environment:
      SQL_SENTINEL_TEST_FIXTURES: "true"
      GITHUB_PUBLISH_COMMENTS: "true"
      SQL_SENTINEL_RAG_DIMENSION: "3"
      SQL_SENTINEL_SHADOW_TABLES: "orders,customers,invoices"
  sentinel-worker:
    environment:
      SQL_SENTINEL_WORKER_LEASE: "6s"
      SQL_SENTINEL_SHADOW_TABLES: "orders,customers,invoices"
  prometheus:
    networks: [private,egress]
    ports: ["127.0.0.1:29093:9090"]
  proxy:
    ports: !override ["127.0.0.1:29880:8080", "127.0.0.1:29443:8443"]
    volumes: !override ["./Acceptance.Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
  fixtures:
    image: local/sql-sentinel-fixture:reviewed
    build: {context: ../sql-sentinel, dockerfile: Dockerfile.fixture}
    command: ["fixture-server"]
    networks: [private, egress]
    ports: ["127.0.0.1:29090:8090"]
