# Explicit local test overlay: no real email, all published ports are loopback.
services:
  casdoor:
    ports: ["127.0.0.1:8000:8000"]
  mailpit:
    image: axllent/mailpit:v1.27.10
    profiles: [identity-test]
    environment: {MP_MAX_MESSAGES: "50"}
    ports: ["127.0.0.1:8025:8025"]
    networks: [private, egress]
    mem_limit: 96m
    pids_limit: 64
