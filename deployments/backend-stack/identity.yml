# Overlay with compose.yml. Private state is generated by identity-setup.py.
services:
  identity-db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: casdoor
      MYSQL_USER: casdoor
      MYSQL_PASSWORD_FILE: /run/secrets/identity_mysql
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/identity_mysql_root
    secrets: [identity_mysql, identity_mysql_root]
    volumes: [identity-db:/var/lib/mysql]
    networks: [private]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$(cat /run/secrets/identity_mysql)" mysql -ucasdoor -e "SELECT 1" casdoor >/dev/null 2>&1']
      interval: 5s
      timeout: 4s
      retries: 30
  casdoor:
    image: casbin/casdoor:v4.23.0@sha256:e13c9aada231f7338a03ab0ae7054d0a9480e77283338ab9fc319d88fe2b3ce0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m", "/logs:rw,noexec,nosuid,size=16m,uid=1000,gid=1000"]
    depends_on:
      identity-db: {condition: service_healthy}
    volumes: ["./identity-private/app.conf:/conf/app.conf:ro", "./identity-private/init_data.json:/conf/init_data.json:ro"]
    networks: [private, egress]
    mem_limit: 512m
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  console-sessions:
    image: redis:7.4-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    command: [sh, /usr/local/bin/redis-start.sh]
    secrets:
      - {source: identity_session_password, target: redis_password}
    volumes: ["./redis-start.sh:/usr/local/bin/redis-start.sh:ro", "console-sessions:/data"]
    networks: [private]
    mem_limit: 320m
    pids_limit: 64
secrets:
  identity_mysql: {file: ./identity-private/mysql_password}
  identity_mysql_root: {file: ./identity-private/mysql_root}
  # Uses a separate secret name from the existing backend Redis.
  identity_session_password: {file: ./identity-private/redis_password}
volumes:
  identity-db:
  console-sessions:
