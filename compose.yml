name: agentmesh-reference-runtime

x-runtime-env: &runtime-env
  AGENTMESH_USAGE_KAFKA_MYSQL_DSN: root:agentmesh-local-only@tcp(mysql:3306)/agentmesh_control?parseTime=true&loc=UTC
  AGENTMESH_USAGE_KAFKA_BROKERS: kafka:9092

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agentmesh_control
      MYSQL_ROOT_PASSWORD: agentmesh-local-only
    ports:
      - "127.0.0.1:13309:3306"
    volumes:
      - agentmesh_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pagentmesh-local-only --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093,PLAINTEXT_HOST://:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:19093:19093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30

  topic-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic agentmesh.usage.v1 --partitions 1 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic agentmesh.usage.v1.dlq --partitions 1 --replication-factor 1

  migration-init:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: agentmesh_control
      MYSQL_ROOT_PASSWORD: agentmesh-local-only
      AGENTMESH_BOOTSTRAP_API_KEY: local-demo-api-key-123456
      AGENTMESH_BOOTSTRAP_TENANT_ID: local_tenant
      AGENTMESH_BOOTSTRAP_MODEL: mock-model
      AGENTMESH_BOOTSTRAP_EMBEDDING_MODEL: embed-model
    volumes:
      - ./migrations:/migrations:ro
      - ./deployments/reference-runtime/migrate.sh:/scripts/migrate.sh:ro
    entrypoint: ["/bin/sh", "/scripts/migrate.sh"]

  api:
    build: .
    command: ["api", "--addr", "0.0.0.0:18080", "--allow-container-listen", "--providers", "mock"]
    environment:
      <<: *runtime-env
      AGENTMESH_BOOTSTRAP_API_KEY: local-demo-api-key-123456
      AGENTMESH_BOOTSTRAP_TENANT_ID: local_tenant
      AGENTMESH_AUTH_STORE: mysql
      AGENTMESH_AUTH_MYSQL_DSN: root:agentmesh-local-only@tcp(mysql:3306)/agentmesh_control?parseTime=true&loc=UTC
      AGENTMESH_ADMIN_TOKEN: local-demo-admin-token-only
      AGENTMESH_QUOTA_MODE: reservation
      AGENTMESH_QUOTA_MYSQL_DSN: root:agentmesh-local-only@tcp(mysql:3306)/agentmesh_control?parseTime=true&loc=UTC
      AGENTMESH_QUOTA_REDIS_URL: redis://redis:6379/0
      AGENTMESH_BOOTSTRAP_TENANT_QUOTA_UNITS: "1000000"
      AGENTMESH_RESERVATION_UNITS: "100"
      AGENTMESH_RATE_LIMIT_PER_MINUTE: "120"
      AGENTMESH_RATE_LIMIT_BURST: "20"
      AGENTMESH_RATE_LIMIT_STORE: redis
      AGENTMESH_RATE_LIMIT_REDIS_URL: redis://redis:6379/1
    depends_on:
      migration-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:18080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:18080/readyz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  usage-kafka-relay:
    build: .
    command: ["usage-kafka-relay"]
    environment:
      <<: *runtime-env
      AGENTMESH_USAGE_KAFKA_RELAY_INTERVAL: 1s
      AGENTMESH_USAGE_KAFKA_RELAY_BATCH_SIZE: "16"
    depends_on:
      migration-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pidof usage-kafka-relay >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  usage-kafka-worker:
    build: .
    command: ["usage-kafka-worker"]
    environment:
      <<: *runtime-env
      AGENTMESH_USAGE_KAFKA_WORKER_GROUP: agentmesh-usage-projection-v1
      AGENTMESH_USAGE_KAFKA_WORKER_MAX_ATTEMPTS: "3"
    depends_on:
      migration-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pidof usage-kafka-worker >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  agentmesh_mysql:
